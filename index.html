<!DOCTYPE html>
<html>
<head>
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1> Movie Ticket Booking System</h1>
    <p>Book your favourite movie tickets!</p>
</header>

<div class="container">
    <div class="movies">
        <h2>Available Movies</h2>
        <div class="movie">KGF- Rs150</div>
        <div class="movie">Toxic- Rs140</div>
        <div class="movie">Karuppu- Rs120</div>
    </div>

    <div class="booking">
        <h2>Book Your Tickets</h2>

        <form id="bookingForm">
            <label>Select Movie</label>
            <select id="movie" required>
                <option>Choose Movie</option>
                <option value="KGF">KGF - Rs150</option>
                <option value="Toxic">Toxic - Rs140</option>
                <option value="Karuppu">Karuppu - Rs120</option>
            </select>

            <label>Show Time</label>
            <select id="time" required>
                <option value="">Choose Time</option>
                <option>10:00 AM - 12:30 PM</option>
                <option>2:00 PM - 4:30 PM</option>
                <option>6:00 PM - 8:30 PM</option>
                <option>9:30 PM - 12:O0 AM</option>
            </select>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label>Number of Tickets</label>
            <input type="number" id="tickets" min="1" step="1" placeholder="Enter tickets" required>

            <p>Total Price: Rs<span id="total">0</span></p>

            <button type="submit" class="booknow">Book Now</button>
            <button type="reset" class="reset">Reset</button>
        </form>

        <p id="message"></p>
    </div>

    <div class="bookings">
        <h2>Your Bookings (<span id="count">0</span>)</h2>
        <input type="text" id="search" placeholder="Search movie name">
        <div id="bookingList"></div>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
